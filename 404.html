<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Page not found | Rae Ann Collective</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .error-page {
            min-height: calc(100vh - var(--header-height));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--section-padding) 1.5rem;
            text-align: center;
        }

        .error-page-inner {
            max-width: 28rem;
        }

        .error-code {
            margin: 0 0 0.75rem;
            font-family: var(--font-heading);
            font-size: clamp(3rem, 10vw, 4.5rem);
            font-weight: 600;
            line-height: 1;
            color: var(--color-accent-secondary);
        }

        .error-page h1 {
            margin: 0 0 1rem;
            font-family: var(--font-heading);
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 600;
            color: var(--color-text);
        }

        .error-page p {
            margin: 0 0 2rem;
            color: var(--color-text-muted);
        }
    </style>
</head>
<body>
    <header class="site-header" id="site-header">
        <div class="container header-inner">
            <a class="logo-link" href="/" aria-label="Rae Ann Collective home">
                <img
                    class="site-logo"
                    src="assets/Rae%20Ann%20Logo%20Suite%20-%203.png"
                    alt="Rae Ann Collective"
                    width="120"
                    height="120"
                    decoding="async"
                >
            </a>
        </div>
    </header>

    <main class="error-page" id="main-content">
        <div class="error-page-inner">
            <p class="error-code" aria-hidden="true">404</p>
            <h1>Page not found</h1>
            <p>This page doesn&rsquo;t exist. Head back to the Rae Ann Collective home page to explore our brands.</p>
            <a class="btn btn--primary" href="/">Return home</a>
        </div>
    </main>
</body>
</html>
